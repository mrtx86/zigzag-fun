<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOGE PUMP - CRYPTO DEGEN EDITION</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e11; 
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 10s linear infinite;
            
            color: #fff;
            font-family: 'Press Start 2P', cursive; 
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        canvas, #gameContainer {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #000000; 
            border: 4px solid #FDCB58; 
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(253, 203, 88, 0.4), 
                        0 0 80px rgba(0, 255, 0, 0.2); 
            overflow: hidden;
            transform-origin: center center; 
            left: 0;
            top: 0;
        }

        @keyframes shake-pos {
            0% { left: 0px; top: 0px; }
            10% { left: -10px; top: -10px; }
            20% { left: 10px; top: 10px; }
            30% { left: -10px; top: 10px; }
            40% { left: 10px; top: -10px; }
            50% { left: -5px; top: -5px; }
            60% { left: 5px; top: 5px; }
            70% { left: -5px; top: 5px; }
            80% { left: 5px; top: -5px; }
            90% { left: -2px; top: -2px; }
            100% { left: 0px; top: 0px; }
        }
        .shake {
            animation: shake-pos 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        #gameCanvas {
            display: block;
        }

        #audioToggle {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 200;
            user-select: none;
            opacity: 0.8;
            pointer-events: auto; 
        }
        #audioToggle:active { transform: scale(0.9); }

        #ui {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #score {
            font-size: 32px; 
            margin: 0;
            color: #00ff00; 
            text-shadow: 4px 4px 0px #005500; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
        }
        
        #startMockCanvas {
            position: absolute;
            bottom: 66%; 
            left: 50%;
            transform: translateX(-50%);
            width: 96px; 
            height: 96px;
            background: transparent;
            image-rendering: pixelated;
            z-index: 10;
            pointer-events: none;
        }

        #instruction {
            position: absolute;
            bottom: 55%; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            color: #ddd;
            font-size: 16px; 
            text-transform: uppercase;
            line-height: 1.6;
            z-index: 10; 
            pointer-events: none;
            animation: blink 0.8s infinite steps(2, start); 
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #gameOverBoard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000;
            padding: 24px 20px; 
            text-align: center;
            display: none;
            z-index: 100;
            width: 340px; 
            border: 6px solid #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #avatarCanvas {
            display: block;
            margin: 10px auto; 
            width: 128px; 
            height: 128px;
            background: transparent; 
            border: none; 
            image-rendering: pixelated;
        }

        #gameOverBoard h2 {
            margin: 5px 0 5px 0;
            font-size: 20px; 
            color: #ff3333; 
            text-transform: uppercase;
            line-height: 1.5;
        }
        
        #tauntText {
            font-size: 10px; 
            color: #FDCB58; 
            margin: 0 0 15px 0;
            text-transform: uppercase;
            line-height: 1.6;
            min-height: 25px;
        }

        .score-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; 
            font-size: 14px; 
            margin: 12px 0;
            color: #aaaaaa;
        }
        .score-val {
            font-size: 24px; 
            color: #ffffff;
            text-shadow: 2px 2px 0px #555;
            display: inline-block; 
        }
        #finalScore { color: #00ff00; }
        #highScore { color: #FDCB58; }

        #btnRestart {
            margin-top: 25px;
            padding: 14px 24px; 
            font-size: 16px; 
            font-family: 'Press Start 2P', cursive; 
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px; 
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
        }
        #btnRestart:hover {
            background: #00ff00; 
        }
        #btnRestart:active {
            background: #008800;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="audioToggle">🔊</div>
        
        <div id="ui">
            <p id="score">$0</p>
        </div>
        
        <canvas id="startMockCanvas" width="64" height="64"></canvas>
        <div id="instruction">TAP TO PUMP<br>TO THE MOON</div>
        
        <div id="gameOverBoard">
            <canvas id="avatarCanvas" width="64" height="64"></canvas>
            
            <h2 id="deathMsg">LIQUIDATED!</h2>
            <div id="tauntText">WOW. MUCH REKT.</div>
            
            <div class="score-info">PNL: <span id="finalScore" class="score-val">$0</span></div>
            <div class="score-info">ATH: <span id="highScore" class="score-val">$0</span></div>
            
            <button id="btnRestart">BUY THE DIP</button>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        // ==========================================
        // 1. HỆ THỐNG ÂM THANH (WEB AUDIO API SYNTH)
        // ==========================================
        let audioCtx = null;
        let isMuted = false;
        let bgmInterval = null;
        let isBgmPlaying = false;

        const audioToggleBtn = document.getElementById('audioToggle');

        audioToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            isMuted = !isMuted;
            audioToggleBtn.innerText = isMuted ? "🔇" : "🔊";
            if(isMuted) stopBGM();
            else if(gameStarted && !isGameOver) startBGM();
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol=0.1, freqEnd=null) {
            if (isMuted || !audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = type;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (freqEnd) {
                osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
            }
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- CÁC SFX HIỆN TẠI ---
        function playClickSFX() {
            playTone(400, 'square', 0.08, 0.03, 600);
        }
        
        function playScoreSFX() {
            playTone(800, 'square', 0.1, 0.05);
            setTimeout(() => playTone(1200, 'square', 0.15, 0.05), 100);
        }

        function playGameOverSFX() {
            playTone(200, 'sawtooth', 0.4, 0.1, 50);
            setTimeout(() => playTone(150, 'sawtooth', 0.6, 0.1, 20), 200);
        }

        // --- SFX MỚI BỔ SUNG ---
        function playUfoSFX() {
            if (isMuted || !audioCtx) return;
            // Tiếng cảnh báo réo lên rồi hạ xuống rợn người
            playTone(800, 'sine', 0.4, 0.05, 1400);
            setTimeout(() => playTone(1400, 'sine', 0.4, 0.05, 800), 400);
        }

        function playAthSFX() {
            if (isMuted || !audioCtx) return;
            // Tiếng kèn chiến thắng (Tèn-tén-ten-ténnnn)
            setTimeout(() => playTone(523.25, 'square', 0.1, 0.05), 0);     // C5
            setTimeout(() => playTone(659.25, 'square', 0.1, 0.05), 100);   // E5
            setTimeout(() => playTone(783.99, 'square', 0.1, 0.05), 200);   // G5
            setTimeout(() => playTone(1046.50, 'square', 0.4, 0.05), 300);  // C6 ngân dài
        }

        // --- NHẠC NỀN ---
        const bgmNotes = [130.81, 130.81, 155.56, 174.61, 196.00, 196.00, 174.61, 155.56];
        let bgmIndex = 0;

        function startBGM() {
            if (isMuted || isBgmPlaying) return;
            isBgmPlaying = true;
            bgmInterval = setInterval(() => {
                if(!isMuted) {
                    playTone(bgmNotes[bgmIndex], 'triangle', 0.15, 0.03);
                    bgmIndex = (bgmIndex + 1) % bgmNotes.length;
                }
            }, 180); 
        }

        function stopBGM() {
            isBgmPlaying = false;
            clearInterval(bgmInterval);
        }


        // ==========================================
        // 2. LOGIC GAME CHÍNH
        // ==========================================
        const container = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const avatarCanvas = document.getElementById('avatarCanvas');
        const avatarCtx = avatarCanvas.getContext('2d');
        
        const startMockCanvas = document.getElementById('startMockCanvas');
        const startMockCtx = startMockCanvas.getContext('2d');
        
        const scoreEl = document.getElementById('score');
        const boardEl = document.getElementById('gameOverBoard');
        const finalScoreEl = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');
        const btnRestart = document.getElementById('btnRestart');
        const instructionEl = document.getElementById('instruction');
        const tauntTextEl = document.getElementById('tauntText');

        ctx.imageSmoothingEnabled = false;
        avatarCtx.imageSmoothingEnabled = false;
        startMockCtx.imageSmoothingEnabled = false;

        function resizeGame() {
            let scale = Math.min((window.innerWidth - 20) / 400, (window.innerHeight - 20) / 600);
            if (scale > 1.3) scale = 1.3;
            container.style.transform = `scale(${scale})`;
        }
        resizeGame();
        window.addEventListener('resize', resizeGame);

        const P_SIZE_UI = 4; 
        const P_SIZE = 4; 

        const DOGE_GOLD = '#FDCB58'; 
        const DOGE_WHITE = '#FFFFFF'; 
        const DOGE_BLACK = '#000000'; 
        
        const obstaclePalette = ['#00ff00', '#ff3333'];
        const confettiColors = ['#00ff00', '#ff3333', '#FDCB58', '#00ffff', '#ff00ff', '#ffffff'];

        let isGameOver = false;
        let gameStarted = false;
        let score = 0;
        let gameSpeed = 2.8; 
        let particles = [];
        let obstacles = [];
        let stars = []; 
        let floatingTexts = []; 
        let confettis = []; 

        let savedHighScore = localStorage.getItem('zigzag_crypto_ath') || 0;
        let nextSpawnDistance = 150; 

        const spikeWidth = 24;  
        const spikeHeight = 48; 
        const wallBase = 8;     
        let spikeOffsetY = 0;   

        const taunts = [
            "Funds are NOT Safu.",
            "Elon is laughing at your paper hands.",
            "CZ is disappointed in you.",
            "Trump calls you a 'Loser'.",
            "Degen skills not included.",
            "Say goodbye to your house, anon.",
            "Paper hands detected.",
            "Buy high, sell low like a pro.",
            "FOMO is a disease.",
            "If you can't hold you won't be rich.",
            "Doge to the moon!",
            "Buy now or cry later.",
            "Abducted by market manipulators.", 
            "Aliens dumped on you."             
        ];

        function getDistinctObstacleColor() {
            return obstaclePalette[Math.floor(Math.random() * obstaclePalette.length)];
        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            radius: 12, 
            vx: 4,
            targetVx: 4,
            accel: 0.8,
            visible: true
        };

        const ufo = {
            active: false,
            x: 0, y: 0,
            startX: 0, startY: 0,
            cpX: 0, cpY: 0, 
            endX: 0, endY: 0,
            t: 0,           
            speed: 0.008
        };

        const obstacleHeight = 24; 

        class Star {
            constructor() {
                this.x = Math.floor(Math.random() * canvas.width);
                this.y = Math.floor(Math.random() * canvas.height);
                this.size = (Math.random() < 0.3 ? 2 : 1) * P_SIZE; 
                this.speed = (Math.random() * 1.5) + 0.5; 
            }
            update() {
                this.y += this.speed + (gameSpeed * 0.3);
                if (this.y > canvas.height) {
                    this.y = -this.size;
                    this.x = Math.floor(Math.random() * canvas.width);
                }
            }
            draw() {
                ctx.fillStyle = '#ffffff';
                let snapY = Math.floor(this.y / P_SIZE) * P_SIZE;
                let snapX = Math.floor(this.x / P_SIZE) * P_SIZE;
                ctx.fillRect(snapX, snapY, this.size, this.size);
            }
        }

        for(let i = 0; i < 40; i++) stars.push(new Star());

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 16; 
                this.vy = (Math.random() - 0.5) * 16;
                this.size = P_SIZE; 
                this.life = 100;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.92; this.vy *= 0.92;
                this.life -= 4; 
            }
            draw() {
                if (this.life <= 0) return;
                ctx.fillStyle = this.life > 40 ? this.color : '#888888';
                let snapX = Math.floor(this.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(this.y / P_SIZE) * P_SIZE;
                ctx.fillRect(snapX, snapY, this.size, this.size);
            }
        }

        class Confetti {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = P_SIZE * (Math.random() < 0.5 ? 1 : 2); 
                this.color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 10 + 5; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 6; 
                
                this.gravity = 0.4;
                this.drag = 0.95; 
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.drag;
                this.vy += this.gravity;
            }
            draw() {
                ctx.fillStyle = this.color;
                let snapX = Math.floor(this.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(this.y / P_SIZE) * P_SIZE;
                ctx.fillRect(snapX, snapY, this.size, this.size);
            }
        }

        class FloatingText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1;
                this.vy = -1.5; 
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.025; 
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#00ff00'; 
                ctx.font = '24px "Press Start 2P", cursive';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function drawTrumpSprite(curCtx, x, y) {
            curCtx.fillStyle = '#F4A261';
            curCtx.fillRect(x - 4*P_SIZE_UI, y - 4*P_SIZE_UI, 9*P_SIZE_UI, 9*P_SIZE_UI); 
            curCtx.fillRect(x - 5*P_SIZE_UI, y, P_SIZE_UI, 4*P_SIZE_UI);

            curCtx.fillStyle = '#E9C46A';
            curCtx.fillRect(x - 6*P_SIZE_UI, y - 6*P_SIZE_UI, 12*P_SIZE_UI, 3*P_SIZE_UI); 
            curCtx.fillRect(x + 2*P_SIZE_UI, y - 7*P_SIZE_UI, 2*P_SIZE_UI, P_SIZE_UI); 
            curCtx.fillRect(x - 4*P_SIZE_UI, y - 3*P_SIZE_UI, 2*P_SIZE_UI, P_SIZE_UI); 

            curCtx.fillStyle = '#000000';
            curCtx.fillRect(x + 1*P_SIZE_UI, y - 2*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x + 2*P_SIZE_UI, y + 2*P_SIZE_UI, 3*P_SIZE_UI, P_SIZE_UI); 
        }

        function drawElonSprite(curCtx, x, y) {
            curCtx.fillStyle = '#E0AC69';
            curCtx.fillRect(x - 5*P_SIZE_UI, y - 4*P_SIZE_UI, 10*P_SIZE_UI, 10*P_SIZE_UI); 
            curCtx.fillRect(x - 3*P_SIZE_UI, y + 4*P_SIZE_UI, 6*P_SIZE_UI, 2*P_SIZE_UI); 

            curCtx.fillStyle = '#8D6E63';
            curCtx.fillRect(x - 5*P_SIZE_UI, y - 6*P_SIZE_UI, 10*P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x - 6*P_SIZE_UI, y - 4*P_SIZE_UI, P_SIZE_UI, 3*P_SIZE_UI); 
            curCtx.fillRect(x + 5*P_SIZE_UI, y - 4*P_SIZE_UI, P_SIZE_UI, 3*P_SIZE_UI); 

            curCtx.fillStyle = '#000000';
            curCtx.fillRect(x - 3*P_SIZE_UI, y - 1*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x + 2*P_SIZE_UI, y - 1*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x - 2*P_SIZE_UI, y + 2*P_SIZE_UI, 4*P_SIZE_UI, P_SIZE_UI); 
        }

        function drawCZSprite(curCtx, x, y) {
            curCtx.fillStyle = '#DDBE96';
            curCtx.fillRect(x - 5*P_SIZE_UI, y - 4*P_SIZE_UI, 10*P_SIZE_UI, 10*P_SIZE_UI); 
            curCtx.fillRect(x - 3*P_SIZE_UI, y - 5*P_SIZE_UI, 6*P_SIZE_UI, P_SIZE_UI); 

            curCtx.fillStyle = '#9E9E9E';
            curCtx.fillRect(x - 5*P_SIZE_UI, y - 4*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x + 4*P_SIZE_UI, y - 4*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 

            curCtx.fillStyle = '#000000';
            curCtx.fillRect(x - 3*P_SIZE_UI, y - 1*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x + 2*P_SIZE_UI, y - 1*P_SIZE_UI, P_SIZE_UI, 2*P_SIZE_UI); 
            curCtx.fillRect(x - 2*P_SIZE_UI, y + 2*P_SIZE_UI, 4*P_SIZE_UI, P_SIZE_UI); 

            curCtx.fillStyle = '#9E9E9E';
            curCtx.fillRect(x - 2*P_SIZE_UI, y + 4*P_SIZE_UI, 4*P_SIZE_UI, P_SIZE_UI); 
            curCtx.fillRect(x - 1*P_SIZE_UI, y + 3*P_SIZE_UI, 2*P_SIZE_UI, P_SIZE_UI); 
        }

        function setRandomStartFace() {
            startMockCtx.clearRect(0, 0, startMockCanvas.width, startMockCanvas.height);
            const randomMockChoice = Math.floor(Math.random() * 3);
            if (randomMockChoice === 0) {
                drawTrumpSprite(startMockCtx, 32, 32);
            } else if (randomMockChoice === 1) {
                drawElonSprite(startMockCtx, 32, 32);
            } else {
                drawCZSprite(startMockCtx, 32, 32);
            }
        }

        function drawUFO(curCtx, x, y) {
            curCtx.fillStyle = '#00ffff';
            curCtx.fillRect(x - 2*P_SIZE, y - 3*P_SIZE, 4*P_SIZE, 2*P_SIZE);
            curCtx.fillStyle = '#ffffff'; 
            curCtx.fillRect(x - 1*P_SIZE, y - 3*P_SIZE, P_SIZE, P_SIZE);

            curCtx.fillStyle = '#9e9e9e';
            curCtx.fillRect(x - 4*P_SIZE, y - P_SIZE, 8*P_SIZE, P_SIZE);
            curCtx.fillRect(x - 6*P_SIZE, y, 12*P_SIZE, P_SIZE);
            curCtx.fillRect(x - 4*P_SIZE, y + P_SIZE, 8*P_SIZE, P_SIZE);

            let time = Date.now();
            curCtx.fillStyle = (time % 400 < 200) ? '#ff3333' : '#00ff00';
            curCtx.fillRect(x - 5*P_SIZE, y, P_SIZE, P_SIZE);
            
            curCtx.fillStyle = (time % 400 > 200) ? '#ff3333' : '#00ff00';
            curCtx.fillRect(x + 4*P_SIZE, y, P_SIZE, P_SIZE);
            
            curCtx.fillStyle = '#ffff00';
            curCtx.fillRect(x - 1*P_SIZE, y + 2*P_SIZE, 2*P_SIZE, P_SIZE);
        }

        function createObstacle() {
            let difficultyFactor = score * 1.5; 
            
            let currentMaxGap = Math.max(80, 150 - difficultyFactor); 
            let currentMinGap = Math.max(60, 110 - difficultyFactor); 
            
            let gapWidth = Math.floor(Math.random() * (currentMaxGap - currentMinGap + 1)) + currentMinGap;
            gapWidth = Math.floor(gapWidth / P_SIZE) * P_SIZE; 
            
            let safeWallDist = spikeWidth + wallBase + 20;
            let gapX = Math.random() * (canvas.width - gapWidth - safeWallDist*2) + safeWallDist;
            gapX = Math.floor(gapX / P_SIZE) * P_SIZE;

            obstacles.push({
                y: -40, gapX: gapX, gapWidth: gapWidth, passed: false,
                color: getDistinctObstacleColor() 
            });

            nextSpawnDistance = Math.floor(Math.random() * (220 - 120 + 1)) + 120;
        }

        function resetGame() {
            score = 0;
            gameSpeed = 2.8; 
            
            obstacles = [];
            particles = [];
            floatingTexts = []; 
            confettis = []; 
            spikeOffsetY = 0;
            isGameOver = false;
            gameStarted = false; 
            ufo.active = false; 
            
            ball.x = canvas.width / 2;
            ball.vx = 4;
            ball.targetVx = 4;
            ball.accel = 0.8;
            ball.visible = true;
            
            scoreEl.style.opacity = '0';
            scoreEl.innerText = "$" + score;
            boardEl.style.display = 'none';
            
            instructionEl.style.display = 'block';
            startMockCanvas.style.display = 'block';
            setRandomStartFace();
            
            stopBGM();
        }

        function drawDogeSprite(curCtx, x, y, isFlying = false) {
            curCtx.fillStyle = DOGE_GOLD;
            curCtx.fillRect(x - 12, y - 8, 24, 16); 
            curCtx.fillRect(x - 8, y - 12, 16, 20); 
            
            curCtx.fillRect(x - 12, y - 16, 4, 4);
            curCtx.fillRect(x - 8, y - 12, 4, 4);
            curCtx.fillRect(x + 8, y - 16, 4, 4);
            curCtx.fillRect(x + 4, y - 12, 4, 4);

            curCtx.fillStyle = DOGE_WHITE; 
            curCtx.fillRect(x - 8, y + 8, 4, 4); 
            curCtx.fillRect(x + 4, y + 8, 4, 4); 

            curCtx.fillStyle = DOGE_WHITE;
            curCtx.fillRect(x - 8, y, 16, 8); 
            curCtx.fillRect(x - 12, y + 4, 4, 4); 
            curCtx.fillRect(x + 8, y + 4, 4, 4); 
            curCtx.fillRect(x - 4, y - 4, 8, 4); 

            curCtx.fillStyle = DOGE_BLACK;
            curCtx.fillRect(x - 2, y + 2, 4, 4);
            curCtx.fillRect(x - 8, y - 4, 4, 4); 
            curCtx.fillRect(x + 4, y - 4, 4, 4); 

            if (isFlying) {
                let flicker = Math.random();
                curCtx.fillStyle = '#ff5500'; 
                curCtx.fillRect(x - 4, y + 12, 8, 4);
                curCtx.fillRect(x - 2, y + 16, 4, flicker > 0.5 ? 4 : 8);
                curCtx.fillStyle = '#ffff00'; 
                curCtx.fillRect(x - 2, y + 12, 4, 4);
            }
        }

        function drawPixelatedChart(ctx, width, height, opacity) {
            ctx.globalAlpha = opacity;
            const numCandles = 16;     
            const candleWidth = 3;     
            const wickWidth = 1;       
            const spacing = 1;         

            const startX = Math.floor((width - (numCandles * (candleWidth + spacing))) / 2);

            for (let i = 0; i < numCandles; i++) {
                const isBull = Math.random() < 0.5;
                const color = isBull ? '#00ff00' : '#ff3333'; 
                
                const bodyHeight = Math.floor(Math.random() * 20 + 8); 
                const bodyY = Math.floor(Math.random() * (height - bodyHeight - 16) + 8);
                
                const wickHeight = bodyHeight + Math.floor(Math.random() * 12 + 4);
                const wickY = bodyY - Math.floor((wickHeight - bodyHeight) / 2);

                const x = startX + i * (candleWidth + spacing);

                ctx.fillStyle = color;
                ctx.fillRect(x + 1, wickY, wickWidth, wickHeight); 
                ctx.fillRect(x, bodyY, candleWidth, bodyHeight);
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            ball.visible = false;
            
            stopBGM();
            
            container.classList.add('shake');
            setTimeout(() => {
                container.classList.remove('shake');
            }, 400); 
            
            setTimeout(() => {
                avatarCtx.clearRect(0, 0, avatarCanvas.width, avatarCanvas.height);
                drawPixelatedChart(avatarCtx, 64, 64, 0.25); 
                avatarCtx.globalAlpha = 1;
                drawDogeSprite(avatarCtx, 32, 32, false); 

                scoreEl.style.opacity = '0'; 
                finalScoreEl.innerText = "$" + score;
                highScoreEl.innerText = "$" + savedHighScore;
                boardEl.style.display = 'block';
            }, 600);
            
            for (let i = 0; i < 40; i++) particles.push(new Particle(ball.x, ball.y, DOGE_GOLD));
            
            if (score > savedHighScore) {
                savedHighScore = score;
                localStorage.setItem('zigzag_crypto_ath', savedHighScore);
                document.getElementById('deathMsg').innerText = "NEW ATH!";
                document.getElementById('deathMsg').style.color = "#00ff00"; 
                
                for (let i = 0; i < 100; i++) {
                    confettis.push(new Confetti(canvas.width / 2, canvas.height / 2));
                }
                
                // MỚI: ÂM THANH KHI ĐẠT ATH MỚI VÀ BẮN PHÁO BÔNG
                playGameOverSFX(); // Tiếng rớt nến
                setTimeout(() => playAthSFX(), 300); // Kèm theo kèn chiến thắng
                
            } else {
                document.getElementById('deathMsg').innerText = "LIQUIDATED!";
                document.getElementById('deathMsg').style.color = "#ff3333"; 
                
                // Bình thường thì chỉ kêu tiếng sập nguồn
                playGameOverSFX();
            }

            const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
            tauntTextEl.innerText = `"${randomTaunt}"`;
        }

        function update() {
            stars.forEach(star => star.update());
            
            particles.forEach((p, i) => {
                p.update();
                if (p.life <= 0) particles.splice(i, 1);
            });

            floatingTexts.forEach((ft, i) => {
                ft.update();
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            });

            confettis.forEach((c, i) => {
                c.update();
                if (c.y > canvas.height) confettis.splice(i, 1); 
            });

            if (!gameStarted || isGameOver) return;

            if (ufo.active) {
                ufo.t += ufo.speed;
                if (ufo.t >= 1) {
                    ufo.active = false;
                } else {
                    let u = 1 - ufo.t;
                    ufo.x = u * u * ufo.startX + 2 * u * ufo.t * ufo.cpX + ufo.t * ufo.t * ufo.endX;
                    ufo.y = u * u * ufo.startY + 2 * u * ufo.t * ufo.cpY + ufo.t * ufo.t * ufo.endY;

                    let dx = ball.x - ufo.x;
                    let dy = ball.y - ufo.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 10 + 12) { 
                        triggerGameOver(); 
                        return;
                    }
                }
            }

            spikeOffsetY = (spikeOffsetY + gameSpeed) % spikeHeight;
            
            if (ball.vx < ball.targetVx) {
                ball.vx += ball.accel;
                if (ball.vx > ball.targetVx) ball.vx = ball.targetVx;
            } else if (ball.vx > ball.targetVx) {
                ball.vx -= ball.accel;
                if (ball.vx < ball.targetVx) ball.vx = ball.targetVx;
            }
            ball.x += ball.vx;

            let hitboxRadius = 10;
            let deathZone = spikeWidth + wallBase - 4; 
            if (ball.x - hitboxRadius <= deathZone || ball.x + hitboxRadius >= canvas.width - deathZone) {
                triggerGameOver(); return;
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                if (ball.y - hitboxRadius < obs.y + obstacleHeight && ball.y + hitboxRadius > obs.y) {
                    if (ball.x - hitboxRadius < obs.gapX || ball.x + hitboxRadius > obs.gapX + obs.gapWidth) {
                        triggerGameOver(); return;
                    }
                }

                if (obs.y > ball.y && !obs.passed) {
                    score += 1; 
                    scoreEl.innerText = "$" + score;
                    obs.passed = true;
                    
                    gameSpeed += 0.1; 
                    ball.targetVx += (ball.targetVx > 0 ? 0.1 : -0.1); 
                    ball.accel += 0.01;

                    playScoreSFX();

                    floatingTexts.push(new FloatingText(ball.x, ball.y - 30, "+$1"));

                    if (score > 0 && (score + 1) % 5 === 0) { 
                        if (!ufo.active && Math.random() < 0.5) { 
                            ufo.active = true;
                            ufo.t = 0;
                            
                            // BẮT ĐẦU PHÁT ÂM THANH CẢNH BÁO ĐĨA BAY (UFO SIREN)
                            playUfoSFX();
                            
                            let startLeft = Math.random() < 0.5;
                            ufo.startX = startLeft ? -60 : canvas.width + 60;
                            ufo.endX = startLeft ? canvas.width + 60 : -60;
                            ufo.startY = ball.y - 200 - Math.random() * 50;
                            ufo.endY = ball.y - 200 - Math.random() * 50;
                            ufo.cpX = canvas.width / 2;
                            ufo.cpY = ball.y + 60; 
                            
                            ufo.speed = 0.008 + (score * 0.0002); 
                            if (ufo.speed > 0.02) ufo.speed = 0.02;
                        }
                    }
                }
            }

            if (obstacles.length > 0 && obstacles[0].y > canvas.height) obstacles.shift();
            
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > nextSpawnDistance) createObstacle();
        }

        function draw() {
            ctx.fillStyle = "#000000"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => star.draw());

            obstacles.forEach(obs => {
                let snapY = Math.floor(obs.y / P_SIZE) * P_SIZE;
                
                ctx.fillStyle = obs.color;
                ctx.fillRect(0, snapY, obs.gapX, obstacleHeight);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, canvas.width - (obs.gapX + obs.gapWidth), obstacleHeight);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillRect(0, snapY, obs.gapX, P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, canvas.width - (obs.gapX + obs.gapWidth), P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, P_SIZE, obstacleHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, snapY + obstacleHeight - P_SIZE, obs.gapX, P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY + obstacleHeight - P_SIZE, canvas.width - (obs.gapX + obs.gapWidth), P_SIZE);
                ctx.fillRect(obs.gapX - P_SIZE, snapY, P_SIZE, obstacleHeight);
            });

            ctx.fillStyle = '#ff1111'; 
            
            let snappedOffsetY = Math.floor(spikeOffsetY / P_SIZE) * P_SIZE;
            let startY = Math.floor(-spikeHeight * 2 / P_SIZE) * P_SIZE;
            
            for (let y = startY; y < canvas.height + spikeHeight; y += P_SIZE) {
                let localY = (y - snappedOffsetY) % spikeHeight;
                if (localY < 0) localY += spikeHeight;

                let phase = localY / spikeHeight; 
                let widthScale = phase < 0.5 ? (phase * 2) : (1 - (phase - 0.5) * 2);
                let curSpikeW = Math.floor((widthScale * spikeWidth) / P_SIZE) * P_SIZE;

                ctx.fillRect(0, y, curSpikeW + wallBase, P_SIZE);
                ctx.fillRect(canvas.width - curSpikeW - wallBase, y, curSpikeW + wallBase, P_SIZE);
            }
            
            particles.forEach(p => p.draw());

            if (ball.visible) {
                let snapX = Math.floor(ball.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(ball.y / P_SIZE) * P_SIZE;
                drawDogeSprite(ctx, snapX, snapY, gameStarted && !isGameOver);
            }

            if (ufo.active) {
                let snapX = Math.floor(ufo.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(ufo.y / P_SIZE) * P_SIZE;
                drawUFO(ctx, snapX, snapY);
            }

            floatingTexts.forEach(ft => ft.draw());
            confettis.forEach(c => c.draw());
        }

        let lastTime = 0;
        const FPS = 60;
        const frameInterval = 1000 / FPS; 

        function loop(timestamp) {
            requestAnimationFrame(loop);

            if (!lastTime) lastTime = timestamp;
            let deltaTime = timestamp - lastTime;

            if (deltaTime >= frameInterval - 2) {
                if (deltaTime > 100) {
                    lastTime = timestamp;
                } else {
                    lastTime = timestamp - (deltaTime % frameInterval);
                }
                
                update();
                draw(); 
            }
        }

        function handleInput(e) {
            if (e.target.id === 'audioToggle') return; 
            if (boardEl.style.display === 'block') return;
            e.preventDefault();
            
            initAudio();
            
            if (!gameStarted) {
                gameStarted = true;
                instructionEl.style.display = 'none'; 
                startMockCanvas.style.display = 'none'; 
                scoreEl.style.opacity = '1'; 
                
                startBGM(); 
                playClickSFX();
                
                if(obstacles.length === 0) createObstacle();
            } 
            else if (!isGameOver) {
                ball.targetVx *= -1;
                playClickSFX();
            }
        }

        container.addEventListener('mousedown', handleInput);
        container.addEventListener('touchstart', handleInput, {passive: false});
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput(e);
            }
        });

        btnRestart.addEventListener('click', (e) => {
            e.stopPropagation(); 
            playClickSFX(); 
            resetGame();
        });
        
        setRandomStartFace();
        requestAnimationFrame(loop); 
    </script>
</body>
