<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEATH ZIGZAG - DOGE CHAOS EDITION</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive; 
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        }

        canvas, #gameContainer {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #000000; 
            border: 6px solid #ffffff;
            overflow: hidden;
            transform-origin: center center; 
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #score {
            font-size: 40px; 
            margin: 0;
            color: #ffffff;
            text-shadow: 4px 4px 0px #555; 
            /* Thêm hiệu ứng mờ dần (fade) kéo dài 0.5 giây */
            opacity: 1; 
            transition: opacity 0.5s ease; 
        }
        
        #instruction {
            position: absolute;
            bottom: 55%; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            color: #ddd;
            font-size: 16px; 
            text-transform: uppercase;
            line-height: 1.6;
            z-index: 10; 
            pointer-events: none;
            animation: blink 0.8s infinite steps(2, start); 
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #gameOverBoard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000;
            padding: 20px 15px; 
            text-align: center;
            display: none;
            z-index: 100;
            width: 280px; 
            border: 6px solid #ffffff;
            box-sizing: border-box;
        }

        /* AVATAR DOGE ĐÃ ĐƯỢC LÀM TRONG SUỐT VÀ X2 KÍCH THƯỚC */
        #avatarCanvas {
            display: block;
            margin: 0 auto 10px auto;
            width: 128px; /* Phóng to gấp đôi (bản cũ 72) */
            height: 128px;
            background: transparent; /* Bỏ viền xám */
            border: none; /* Bỏ khung */
            image-rendering: pixelated;
        }

        #gameOverBoard h2 {
            margin: 0 0 10px 0;
            font-size: 16px; 
            color: #ff3333; 
            text-transform: uppercase;
            line-height: 1.5;
        }
        
        #tauntText {
            font-size: 8px; 
            color: #FDCB58; 
            margin: 0 0 15px 0;
            text-transform: uppercase;
            line-height: 1.6;
            min-height: 25px;
        }

        .score-info {
            font-size: 11px;
            margin: 10px 0;
            color: #aaaaaa;
            line-height: 1.5;
        }
        .score-val {
            font-size: 24px; 
            display: block;
            color: #ffffff;
            margin-top: 8px;
            text-shadow: 2px 2px 0px #555;
        }
        #btnRestart {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 14px;
            font-family: 'Press Start 2P', cursive; 
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 0; 
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
        }
        #btnRestart:hover {
            background: #cccccc;
        }
        #btnRestart:active {
            background: #888888;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <p id="score">0</p>
        </div>
        <div id="instruction">TAP TO START</div>
        <div id="gameOverBoard">
            <canvas id="avatarCanvas" width="64" height="64"></canvas>
            <h2 id="deathMsg">GAME OVER!</h2>
            <div id="tauntText">WOW. MUCH FAIL.</div>
            <div class="score-info">SCORE:<br><span id="finalScore" class="score-val">0</span></div>
            <div class="score-info">BEST:<br><span id="highScore" class="score-val">0</span></div>
            <button id="btnRestart">RESTART</button>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const container = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const avatarCanvas = document.getElementById('avatarCanvas');
        const avatarCtx = avatarCanvas.getContext('2d');
        
        const scoreEl = document.getElementById('score');
        const boardEl = document.getElementById('gameOverBoard');
        const finalScoreEl = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');
        const btnRestart = document.getElementById('btnRestart');
        const instructionEl = document.getElementById('instruction');
        const tauntTextEl = document.getElementById('tauntText');

        ctx.imageSmoothingEnabled = false;
        avatarCtx.imageSmoothingEnabled = false;

        function resizeGame() {
            let scale = Math.min((window.innerWidth - 20) / 400, (window.innerHeight - 20) / 600);
            if (scale > 1.3) scale = 1.3;
            container.style.transform = `scale(${scale})`;
        }
        resizeGame();
        window.addEventListener('resize', resizeGame);

        const P_SIZE = 4; 
        
        const DOGE_GOLD = '#FDCB58'; 
        const DOGE_WHITE = '#FFFFFF'; 
        const DOGE_BLACK = '#000000'; 
        
        const obstaclePalette = ['#00ff00', '#00ffff', '#ffff00', '#ff00ff', '#ffffff'];
        let currentObstaclePaletteIndex = Math.floor(Math.random() * obstaclePalette.length);

        let isGameOver = false;
        let gameStarted = false;
        let score = 0;
        let gameSpeed = 3.5; 
        let particles = [];
        let obstacles = [];
        let stars = []; 

        let savedHighScore = localStorage.getItem('zigzag_highscore') || 0;
        let nextSpawnDistance = 150; 

        const spikeWidth = 24;  
        const spikeHeight = 48; 
        const wallBase = 8;     
        let spikeOffsetY = 0;   

        const taunts = [
            "Wow. Such fail. Very dead.",
            "Much slow. So noob. Wow.",
            "Skill issue detected.",
            "Are you playing with your toes?",
            "My grandma has better reflexes.",
            "Tip: Don't hit the walls.",
            "Did you even try?",
            "Doge is highly disappointed.",
            "Try turning your monitor on.",
            "Error 404: Skills not found.",
            "Please tell me you lagged.",
            "That gap was huge, bro.",
            "Git gud.",
            "Maybe try a slower game?",
            "Reflexes of a potato."
        ];

        function getDistinctObstacleColor() {
            currentObstaclePaletteIndex = (currentObstaclePaletteIndex + 1) % obstaclePalette.length;
            return obstaclePalette[currentObstaclePaletteIndex];
        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            radius: 12, 
            vx: 4,
            visible: true
        };

        const obstacleHeight = 24; 

        class Star {
            constructor() {
                this.x = Math.floor(Math.random() * canvas.width);
                this.y = Math.floor(Math.random() * canvas.height);
                this.size = (Math.random() < 0.3 ? 2 : 1) * P_SIZE; 
                this.speed = (Math.random() * 1.5) + 0.5; 
            }
            update() {
                this.y += this.speed + (gameSpeed * 0.3);
                if (this.y > canvas.height) {
                    this.y = -this.size;
                    this.x = Math.floor(Math.random() * canvas.width);
                }
            }
            draw() {
                ctx.fillStyle = '#ffffff';
                let snapY = Math.floor(this.y / P_SIZE) * P_SIZE;
                let snapX = Math.floor(this.x / P_SIZE) * P_SIZE;
                ctx.fillRect(snapX, snapY, this.size, this.size);
            }
        }

        for(let i = 0; i < 40; i++) stars.push(new Star());

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 16; 
                this.vy = (Math.random() - 0.5) * 16;
                this.size = P_SIZE; 
                this.life = 100;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.92; this.vy *= 0.92;
                this.life -= 4; 
            }
            draw() {
                if (this.life <= 0) return;
                ctx.fillStyle = this.life > 40 ? this.color : '#888888';
                let snapX = Math.floor(this.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(this.y / P_SIZE) * P_SIZE;
                ctx.fillRect(snapX, snapY, this.size, this.size);
            }
        }

        function createObstacle() {
            let currentMaxGap = Math.max(76, 150 - (score * 1.2)); 
            let gapWidth = Math.floor(Math.random() * (currentMaxGap - 60 + 1)) + 60;
            gapWidth = Math.floor(gapWidth / P_SIZE) * P_SIZE; 
            
            let safeWallDist = spikeWidth + wallBase + 20;
            let gapX = Math.random() * (canvas.width - gapWidth - safeWallDist*2) + safeWallDist;
            gapX = Math.floor(gapX / P_SIZE) * P_SIZE;

            obstacles.push({
                y: -40, gapX: gapX, gapWidth: gapWidth, passed: false,
                color: getDistinctObstacleColor() 
            });

            nextSpawnDistance = Math.floor(Math.random() * (220 - 120 + 1)) + 120;
        }

        function resetGame() {
            score = 0;
            gameSpeed = 3.5;
            obstacles = [];
            particles = [];
            spikeOffsetY = 0;
            isGameOver = false;
            gameStarted = true;
            ball.x = canvas.width / 2;
            ball.vx = 4;
            ball.visible = true;
            
            // Kéo độ trong suốt (opacity) về 1 để hiện lại điểm một cách mượt mà
            scoreEl.style.opacity = '1';
            scoreEl.innerText = score;
            
            boardEl.style.display = 'none';
            instructionEl.style.display = 'none';
            
            createObstacle();
        }

        function drawDogeSprite(curCtx, x, y) {
            curCtx.fillStyle = DOGE_GOLD;
            curCtx.fillRect(x - 12, y - 8, 24, 16); 
            curCtx.fillRect(x - 8, y - 12, 16, 20); 
            
            curCtx.fillRect(x - 12, y - 16, 4, 4);
            curCtx.fillRect(x - 8, y - 12, 4, 4);
            curCtx.fillRect(x + 8, y - 16, 4, 4);
            curCtx.fillRect(x + 4, y - 12, 4, 4);

            curCtx.fillStyle = DOGE_WHITE; 
            curCtx.fillRect(x - 8, y + 8, 4, 4); 
            curCtx.fillRect(x + 4, y + 8, 4, 4); 

            curCtx.fillStyle = DOGE_WHITE;
            curCtx.fillRect(x - 8, y, 16, 8); 
            curCtx.fillRect(x - 12, y + 4, 4, 4); 
            curCtx.fillRect(x + 8, y + 4, 4, 4); 
            curCtx.fillRect(x - 4, y - 4, 8, 4); 

            curCtx.fillStyle = DOGE_BLACK;
            curCtx.fillRect(x - 2, y + 2, 4, 4);

            curCtx.fillRect(x - 8, y - 4, 4, 4); 
            curCtx.fillRect(x + 4, y - 4, 4, 4); 
        }

        function triggerGameOver() {
            isGameOver = true;
            ball.visible = false;
            
            for (let i = 0; i < 40; i++) particles.push(new Particle(ball.x, ball.y, DOGE_GOLD));
            
            if (score > savedHighScore) {
                savedHighScore = score;
                localStorage.setItem('zigzag_highscore', savedHighScore);
                document.getElementById('deathMsg').innerText = "NEW RECORD!";
                document.getElementById('deathMsg').style.color = "#00ff00"; 
            } else {
                document.getElementById('deathMsg').innerText = "GAME OVER!";
                document.getElementById('deathMsg').style.color = "#ff3333"; 
            }

            const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
            tauntTextEl.innerText = `"${randomTaunt}"`;

            avatarCtx.clearRect(0, 0, avatarCanvas.width, avatarCanvas.height);
            drawDogeSprite(avatarCtx, 32, 32);

            // Đợi 0.6 giây rồi mới làm mờ điểm ở background và hiện bảng kết quả
            setTimeout(() => {
                scoreEl.style.opacity = '0'; // Kích hoạt hiệu ứng Fade Out
                
                finalScoreEl.innerText = score;
                highScoreEl.innerText = savedHighScore;
                boardEl.style.display = 'block';
            }, 600);
        }

        function update() {
            stars.forEach(star => star.update());
            particles.forEach((p, i) => {
                p.update();
                if (p.life <= 0) particles.splice(i, 1);
            });

            if (!gameStarted || isGameOver) return;

            spikeOffsetY = (spikeOffsetY + gameSpeed) % spikeHeight;
            ball.x += ball.vx;

            let hitboxRadius = 10;
            let deathZone = spikeWidth + wallBase - 4; 
            if (ball.x - hitboxRadius <= deathZone || ball.x + hitboxRadius >= canvas.width - deathZone) {
                triggerGameOver(); return;
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                if (ball.y - hitboxRadius < obs.y + obstacleHeight && ball.y + hitboxRadius > obs.y) {
                    if (ball.x - hitboxRadius < obs.gapX || ball.x + hitboxRadius > obs.gapX + obs.gapWidth) {
                        triggerGameOver(); return;
                    }
                }

                if (obs.y > ball.y && !obs.passed) {
                    score++;
                    scoreEl.innerText = score;
                    obs.passed = true;
                    gameSpeed += 0.15;
                    ball.vx += (ball.vx > 0 ? 0.15 : -0.15);
                }
            }

            if (obstacles.length > 0 && obstacles[0].y > canvas.height) obstacles.shift();
            
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > nextSpawnDistance) createObstacle();
        }

        function draw() {
            ctx.fillStyle = "#000000"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => star.draw());

            obstacles.forEach(obs => {
                let snapY = Math.floor(obs.y / P_SIZE) * P_SIZE;
                
                ctx.fillStyle = obs.color;
                ctx.fillRect(0, snapY, obs.gapX, obstacleHeight);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, canvas.width - (obs.gapX + obs.gapWidth), obstacleHeight);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillRect(0, snapY, obs.gapX, P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, canvas.width - (obs.gapX + obs.gapWidth), P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY, P_SIZE, obstacleHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, snapY + obstacleHeight - P_SIZE, obs.gapX, P_SIZE);
                ctx.fillRect(obs.gapX + obs.gapWidth, snapY + obstacleHeight - P_SIZE, canvas.width - (obs.gapX + obs.gapWidth), P_SIZE);
                ctx.fillRect(obs.gapX - P_SIZE, snapY, P_SIZE, obstacleHeight);
            });

            ctx.fillStyle = '#ff1111'; 
            
            let snappedOffsetY = Math.floor(spikeOffsetY / P_SIZE) * P_SIZE;
            let startY = Math.floor(-spikeHeight * 2 / P_SIZE) * P_SIZE;
            
            for (let y = startY; y < canvas.height + spikeHeight; y += P_SIZE) {
                let localY = (y - snappedOffsetY) % spikeHeight;
                if (localY < 0) localY += spikeHeight;

                let phase = localY / spikeHeight; 
                let widthScale = phase < 0.5 ? (phase * 2) : (1 - (phase - 0.5) * 2);
                let curSpikeW = Math.floor((widthScale * spikeWidth) / P_SIZE) * P_SIZE;

                ctx.fillRect(0, y, curSpikeW + wallBase, P_SIZE);
                ctx.fillRect(canvas.width - curSpikeW - wallBase, y, curSpikeW + wallBase, P_SIZE);
            }
            
            particles.forEach(p => p.draw());

            if (ball.visible) {
                let snapX = Math.floor(ball.x / P_SIZE) * P_SIZE;
                let snapY = Math.floor(ball.y / P_SIZE) * P_SIZE;
                drawDogeSprite(ctx, snapX, snapY);
            }
        }

        function loop() {
            update();
            draw(); 
            requestAnimationFrame(loop);
        }

        function handleInput(e) {
            if (boardEl.style.display === 'block') return;
            e.preventDefault();
            
            if (!gameStarted) {
                gameStarted = true;
                instructionEl.style.display = 'none'; 
                if(obstacles.length === 0) createObstacle();
            } 
            else if (!isGameOver) {
                ball.vx *= -1;
            }
        }

        container.addEventListener('mousedown', handleInput);
        container.addEventListener('touchstart', handleInput, {passive: false});
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput(e);
            }
        });

        btnRestart.addEventListener('click', (e) => {
            e.stopPropagation(); 
            resetGame();
        });
        
        loop(); 
    </script>
</body>
</html>
